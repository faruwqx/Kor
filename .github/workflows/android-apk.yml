# Android'e kurulacak APK'yı derler. Ubuntu runner'da Android SDK hazır gelir.
# Çıktı: Actions → bu iş → Artifacts → "Kor-apk" (Kor.apk). Telefona "bilinmeyen
# kaynaklardan kurulum" açılıp yüklenir. Android sürümü test edilmedi; iOS daha iyi çalışır.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bağımlılıklar
        run: npm ci

      - name: Web derlemesi (BLA ile sertleştirilmiş) ve testler
        run: |
          npx vitest run
          npm run build:hardened

      - name: Android projesine kopyala
        run: npx cap sync android

      - name: Debug APK derlemesi
        run: |
          cd android
          chmod +x gradlew
          # Maven Central bazen CI runner IP'sini rate-limit'ler (429). Aynaya
          # rağmen takılırsa artan beklemeyle 3 kez dene.
          for attempt in 1 2 3; do
            echo "::group::Gradle denemesi $attempt"
            if ./gradlew assembleDebug --no-daemon; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt 3 ]; then
              wait=$((attempt * 60))
              echo "Derleme başarısız (muhtemelen 429). ${wait}s bekleyip tekrar denenecek..."
              sleep "$wait"
            fi
          done
          echo "Üç deneme de başarısız oldu."
          exit 1

      - name: APK paketi
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Kor.apk
          ls -lh Kor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kor-apk
          path: Kor.apk
          retention-days: 30
